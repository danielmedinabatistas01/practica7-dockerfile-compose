
services:
  app:
    image: python:3.12-slim
    container_name: hola-mundo-app
    working_dir: /app
    volumes:
      - ./src:/app
      - ./requirements.txt:/app/requirements.txt
    command: sh -c "pip install -r requirements.txt && python app.py"
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: hola_mundo
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: hola-mundo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hola_mundo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
